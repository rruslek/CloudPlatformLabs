<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кликер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 300px;
            background-color: #343a40;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h3 {
            margin-bottom: 20px;
        }

        .leader-table {
            color: white;
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }

        .click-btn {
            font-size: 2rem;
            padding: 30px 60px;
            border-radius: 50px;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .click-btn:hover {
            transform: scale(1.05);
        }

        .click-counter {
            margin-top: 20px;
            font-size: 1.2rem;
        }

        tr.highlight {
            background-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="sidebar">
        <h3>Лидеры</h3>
        <table class="table table-sm table-borderless leader-table">
            <thead>
            <tr>
                <th>Имя</th>
                <th>Клики</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${leaders}"
                th:classappend="${entry.key} == ${username} ? 'highlight'">
                <td th:text="${entry.key}"></td>
                <td th:text="${entry.value}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="content">
        <form method="post" action="/click">
            <input type="hidden" name="username" th:value="${username}" />
            <button class="btn btn-warning click-btn" type="submit">Клик!</button>
            <div class="click-counter text-center mt-3 text-white">
                Вы нажали: <strong th:text="${clicks}"></strong> раз(а)
            </div>
        </form>
    </div>
</div>
</body>
</html>
